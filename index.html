    <!-- Structured Data (JSON-LD) - FAQPage Schema for Rich Search Accordions -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does Zentrevo plan custom trips from India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tell us when, where, and how you like to travel. A real travel planner builds your trip, itemizes clear prices with no surprises, guides your visa step-by-step, and stays with you on WhatsApp until you're safely home. You receive your tailored itinerary and quote within 24 hours."
          }
        },
        {
          "@type": "Question",
          "name": "Do you guarantee visa approval for Indian passport holders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Visa guidance and document support are provided in good faith. The embassy decides approval. We help with document checklists, appointment scheduling, and confirmed travel vouchers, but never promise or guarantee visa issuance."
          }
        },
        {
          "@type": "Question",
          "name": "Are prices in Indian Rupees (₹) and what is included?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, our trip plans from India are priced in Indian Rupees (₹) per person. Each itinerary clearly itemizes accommodations, private transfers, daily breakfasts, curated excursions, and on-ground concierge support with zero hidden charges."
          }
        },
        {
          "@type": "Question",
          "name": "Which destinations does Zentrevo specialize in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We curate custom trips from India for Bali, Japan, Switzerland, Italy, Turkey, and Kerala, alongside domestic high-altitude expeditions in Ladakh, Mewar royal retreats in Udaipur, and Kashmir cedar houseboats."
          }
        },
        {
          "@type": "Question",
          "name": "What is Zentrevo's cancellation and refund policy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cancellations made 30 or more days prior to travel receive up to an 85% to 90% refund (minus committed third-party flight and hotel non-recoverable booking costs). Approved refunds are returned within 7 to 10 business days."
          }
        }
      ]
    }
    </script>
